services:
  - type: web
    name: stixin-daily-meeting
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard to your Neon.tech connection string
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
